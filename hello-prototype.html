<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello Emem — Mobile Prototype</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Phone shell */
    .phone {
      width: 375px;
      height: 812px;
      background: #fff;
      border-radius: 50px;
      box-shadow:
        0 0 0 12px #111,
        0 0 0 14px #333,
        0 40px 80px rgba(0,0,0,0.6);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Notch */
    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 30px;
      background: #111;
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }

    /* Status bar */
    .status-bar {
      height: 44px;
      background: transparent;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 28px 6px;
      font-size: 12px;
      font-weight: 600;
      color: #111;
      flex-shrink: 0;
    }

    .status-bar .time { font-size: 15px; font-weight: 700; }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons span { font-size: 13px; }

    /* Screen content */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
    }

    /* Decorative blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      animation: float 6s ease-in-out infinite;
    }
    .blob-1 {
      width: 250px; height: 250px;
      background: #fff;
      top: -80px; left: -80px;
      animation-delay: 0s;
    }
    .blob-2 {
      width: 180px; height: 180px;
      background: #fff;
      bottom: -60px; right: -60px;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50%       { transform: translateY(-20px) scale(1.05); }
    }

    /* Hello text */
    .greeting {
      text-align: center;
      z-index: 1;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .greeting .wave {
      font-size: 52px;
      margin-bottom: 16px;
      display: block;
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(18deg); }
      40%      { transform: rotate(-10deg); }
      60%      { transform: rotate(14deg); }
      80%      { transform: rotate(-6deg); }
    }

    .greeting h1 {
      font-size: 38px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.2);
      line-height: 1.1;
    }

    .greeting h1 span {
      display: block;
      font-size: 44px;
      background: linear-gradient(90deg, #ffe259, #ffa751);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .greeting p {
      margin-top: 16px;
      color: rgba(255,255,255,0.75);
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    /* Tap button */
    .tap-btn {
      margin-top: 40px;
      padding: 14px 36px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.15s;
      z-index: 1;
    }
    .tap-btn:hover  { background: rgba(255,255,255,0.3); }
    .tap-btn:active { transform: scale(0.95); }

    /* Toast */
    .toast {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Home indicator */
    .home-indicator {
      height: 34px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    .home-bar {
      width: 134px;
      height: 5px;
      background: #111;
      border-radius: 3px;
      opacity: 0.2;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>

    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <span>&#9679;&#9679;&#9679;&#9679;</span>
        <span>WiFi</span>
        <span>&#128267;</span>
      </div>
    </div>

    <div class="screen">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>

      <div class="greeting">
        <span class="wave">👋</span>
        <h1>hello<span>emem</span></h1>
        <p>Welcome to your prototype</p>
      </div>

      <button class="tap-btn" onclick="showToast()">Say hi back</button>

      <div class="toast" id="toast">Hi there! 🎉</div>
    </div>

    <div class="home-indicator">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    // Live clock
    function updateTime() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      document.querySelector('.time').textContent = `${h}:${m}`;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // Toast notification
    let toastTimer;
    function showToast() {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>

</body>
</html>
